<rect x="52" y="68.65" width="303.09999999999997" height="18.7" rx="4" fill="#D9EAF3" stroke="#D9EAF3" stroke-width="0"/>
<text x="60" y="81.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#2E82AC" text-anchor="start" font-weight="bold">CONTAINMENT TREE  —  MainFrame extends JFrame</text>
