<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720"><rect width="1180" height="720" fill="#FFFFFF"/><text x="40" y="44" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#0E1B2C" text-anchor="start" font-weight="bold">Diagram 27 — Annotations, JavaBeans and dependency wiring</text>
<text x="40" y="64.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#647589" text-anchor="start" font-weight="normal">How a framework learns what your classes mean without reading a configuration file.</text>
<rect x="40" y="78" width="480" height="300" rx="8" fill="none" stroke="#6C5CA8" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="52" y="68.65" width="277.58" height="18.7" rx="4" fill="#E8E4F5" stroke="#E8E4F5" stroke-width="0"/>
<text x="60" y="81.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#6C5CA8" text-anchor="start" font-weight="bold">ANNOTATIONS  ·  metadata attached to code</text>
<rect x="64" y="112" width="432" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="76" y="130" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.4" fill="#6C5CA8" text-anchor="start" font-weight="normal">@Override</text>
<text x="76" y="145" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#647589" text-anchor="start" font-weight="normal">asks the compiler to check a real override</text>
<rect x="380" y="120" width="104" height="24" rx="12.0" fill="#DFF2EA" stroke="#3F9E7C" stroke-width="1.3"/>
<text x="432.0" y="135.096" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1A2A3D" text-anchor="middle" font-weight="bold">used in BasinWatch</text>
<rect x="64" y="156" width="432" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="76" y="174" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.4" fill="#6C5CA8" text-anchor="start" font-weight="normal">@FunctionalInterface</text>
<text x="76" y="189" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#647589" text-anchor="start" font-weight="normal">the interface has exactly one abstract method</text>
<rect x="380" y="164" width="104" height="24" rx="12.0" fill="#DFF2EA" stroke="#3F9E7C" stroke-width="1.3"/>
<text x="432.0" y="179.096" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1A2A3D" text-anchor="middle" font-weight="bold">used in BasinWatch</text>
<rect x="64" y="200" width="432" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="76" y="218" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.4" fill="#6C5CA8" text-anchor="start" font-weight="normal">@Serial</text>
<text x="76" y="233" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#647589" text-anchor="start" font-weight="normal">marks serialization members</text>
<rect x="380" y="208" width="104" height="24" rx="12.0" fill="#DFF2EA" stroke="#3F9E7C" stroke-width="1.3"/>
<text x="432.0" y="223.096" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1A2A3D" text-anchor="middle" font-weight="bold">used in BasinWatch</text>
<rect x="64" y="244" width="432" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="76" y="262" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.4" fill="#6C5CA8" text-anchor="start" font-weight="normal">@Deprecated</text>
<text x="76" y="277" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#647589" text-anchor="start" font-weight="normal">this API should not be used</text>
<rect x="380" y="252" width="104" height="24" rx="12.0" fill="#EDF2F7" stroke="#647589" stroke-width="1.3"/>
<text x="432.0" y="267.096" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1A2A3D" text-anchor="middle" font-weight="bold">general</text>
<rect x="64" y="288" width="432" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="76" y="306" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.4" fill="#6C5CA8" text-anchor="start" font-weight="normal">@Entity / @Table</text>
<text x="76" y="321" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#647589" text-anchor="start" font-weight="normal">this class maps to a database table</text>
<rect x="380" y="296" width="104" height="24" rx="12.0" fill="#EDF2F7" stroke="#647589" stroke-width="1.3"/>
<text x="432.0" y="311.096" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1A2A3D" text-anchor="middle" font-weight="bold">JPA</text>
<rect x="64" y="332" width="432" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="76" y="350" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.4" fill="#6C5CA8" text-anchor="start" font-weight="normal">@Autowired / @Component</text>
<text x="76" y="365" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#647589" text-anchor="start" font-weight="normal">the framework should create and inject this</text>
<rect x="380" y="340" width="104" height="24" rx="12.0" fill="#EDF2F7" stroke="#647589" stroke-width="1.3"/>
<text x="432.0" y="355.096" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1A2A3D" text-anchor="middle" font-weight="bold">Spring</text>
<rect x="550" y="78" width="590" height="300" rx="8" fill="none" stroke="#2E82AC" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="562" y="68.65" width="213.77999999999997" height="18.7" rx="4" fill="#D9EAF3" stroke="#D9EAF3" stroke-width="0"/>
<text x="570" y="81.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#2E82AC" text-anchor="start" font-weight="bold">WHAT A FRAMEWORK DOES WITH THEM</text>
<rect x="574" y="116" width="542" height="38" rx="6" fill="#F2F6FA" stroke="#F2F6FA" stroke-width="0"/>
<text x="588" y="140" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">1. Scan the classpath for annotated classes</text>
<rect x="574" y="158" width="542" height="38" rx="6" fill="#FFFFFF" stroke="#F2F6FA" stroke-width="0"/>
<text x="588" y="182" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">2. Read the metadata with reflection</text>
<rect x="574" y="200" width="542" height="38" rx="6" fill="#F2F6FA" stroke="#F2F6FA" stroke-width="0"/>
<text x="588" y="224" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">3. Create the objects (needs a no-arg constructor — JavaBean rule)</text>
<rect x="574" y="242" width="542" height="38" rx="6" fill="#FFFFFF" stroke="#F2F6FA" stroke-width="0"/>
<text x="588" y="266" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">4. Inject dependencies by type or by name (setters or fields)</text>
<rect x="574" y="284" width="542" height="38" rx="6" fill="#F2F6FA" stroke="#F2F6FA" stroke-width="0"/>
<text x="588" y="308" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">5. Manage their lifecycle and scope</text>
<rect x="574" y="326" width="542" height="38" rx="6" fill="#FFFFFF" stroke="#F2F6FA" stroke-width="0"/>
<text x="588" y="350" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">6. Wire them into a graph the application can request</text>
<text x="574" y="372" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">This is why annotations and JavaBeans appear in the same lecture:</text>
<text x="574" y="390" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">one marks the class, the other gives the framework a way to build it.</text>
<rect x="40" y="400" width="1100" height="92" rx="9" fill="#0E1B2C" stroke="#0E1B2C" stroke-width="1.5"/>
<text x="590.0" y="421.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#0E1B2C" text-anchor="middle" font-weight="bold">THE SAME INTENT, TWO STYLES</text>
<text x="590.0" y="436.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#33465C" text-anchor="middle" font-weight="normal">XML configuration:   &lt;bean id="dataSource" class="…DriverManagerDataSource"&gt;  &lt;property …/&gt;  &lt;/bean&gt;</text>
<text x="590.0" y="451.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#33465C" text-anchor="middle" font-weight="normal">Annotation style:    @Configuration class AppConfig { @Bean public DataSource dataSource() { … } }</text>
<text x="590.0" y="466.40000000000003" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#33465C" text-anchor="middle" font-weight="normal">Both describe the same object graph. Annotations are checked by the compiler and live beside the code;</text>
<text x="590.0" y="481.20000000000005" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#33465C" text-anchor="middle" font-weight="normal">XML is editable without recompiling and centralises configuration in one file.</text>
<rect x="40" y="508" width="1100" height="76.8" rx="6" fill="#FBEFD6" stroke="#D9962B" stroke-width="1.3"/>
<rect x="40" y="508" width="4" height="76.8" rx="2" fill="#D9962B" stroke="#D9962B" stroke-width="0"/>
<circle cx="57" cy="522.6" r="7.5" fill="#D9962B" stroke="#D9962B" stroke-width="1.4"/>
<text x="57" y="526.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="525.96" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">RELATED TECHNIQUE — NOT USED IN BASINWATCH: BasinWatch wires its objects by hand. BasinEngine creates the</text>
<text x="71" y="541.1600000000001" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">DatabaseService, which creates the DatabaseManager, which is passed to each repository constructor. This is</text>
<text x="71" y="556.36" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">constructor injection done manually — the same idea as a framework, with no framework. It is why the project has</text>
<text x="71" y="571.5600000000001" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">no Spring dependency at all, and why the wiring is visible in ordinary Java.</text></svg>