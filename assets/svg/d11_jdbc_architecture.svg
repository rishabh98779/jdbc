<rect x="40" y="412" width="1100" height="66" rx="9" fill="#0E1B2C" stroke="#0E1B2C" stroke-width="1.5"/>
<text x="590.0" y="433.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#0E1B2C" text-anchor="middle" font-weight="bold">THE KEY IDEA</text>
<text x="590.0" y="449.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#33465C" text-anchor="middle" font-weight="normal">JDBC is an interface, not a database. Your code is written against java.sql, so the driver — not your code —</text>
<text x="590.0" y="465.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#33465C" text-anchor="middle" font-weight="normal">knows whether the database is SQLite, PostgreSQL or Oracle. Changing database means changing a driver and a URL.</text>
<text x="40" y="528" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#0E1B2C" text-anchor="start" font-weight="bold">The four JDBC driver types</text>
<rect x="40" y="546" width="260" height="150" rx="9" fill="#FFFFFF" stroke="#647589" stroke-width="1.5"/>
<rect x="40" y="546" width="260" height="32" rx="9" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
<rect x="40" y="566" width="260" height="12" rx="0" fill="#EDF2F7" stroke="#EDF2F7" stroke-width="0"/>
<text x="53" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1A2A3D" text-anchor="start" font-weight="bold">Type 1</text>
<text x="286" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#647589" text-anchor="end" font-weight="bold">not used</text>
<text x="53" y="600" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="bold">JDBC–ODBC bridge</text>
<text x="53" y="622" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">Translates JDBC into ODBC calls.</text>
<text x="53" y="637" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">Needs a native ODBC driver.</text>
<text x="53" y="652" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">Effectively removed from modern Java.</text>
<rect x="313" y="546" width="260" height="150" rx="9" fill="#FFFFFF" stroke="#647589" stroke-width="1.5"/>
<rect x="313" y="546" width="260" height="32" rx="9" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
<rect x="313" y="566" width="260" height="12" rx="0" fill="#EDF2F7" stroke="#EDF2F7" stroke-width="0"/>
<text x="326" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1A2A3D" text-anchor="start" font-weight="bold">Type 2</text>
<text x="559" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#647589" text-anchor="end" font-weight="bold">not used</text>
<text x="326" y="600" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="bold">Native-API, partly Java</text>
<text x="326" y="622" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">Calls the database vendor's</text>
<text x="326" y="637" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">native client library through JNI.</text>
<text x="326" y="652" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">Needs that library installed.</text>
<rect x="586" y="546" width="260" height="150" rx="9" fill="#FFFFFF" stroke="#647589" stroke-width="1.5"/>
<rect x="586" y="546" width="260" height="32" rx="9" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
<rect x="586" y="566" width="260" height="12" rx="0" fill="#EDF2F7" stroke="#EDF2F7" stroke-width="0"/>
<text x="599" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1A2A3D" text-anchor="start" font-weight="bold">Type 3</text>
<text x="832" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#647589" text-anchor="end" font-weight="bold">not used</text>
<text x="599" y="600" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="bold">Network-protocol, all Java</text>
<text x="599" y="622" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">Talks to a middleware server</text>
<text x="599" y="637" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">that translates to the database.</text>
<text x="599" y="652" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">Adds a network hop.</text>
<rect x="859" y="546" width="260" height="150" rx="9" fill="#FFFFFF" stroke="#3F9E7C" stroke-width="1.5"/>
<rect x="859" y="546" width="260" height="32" rx="9" fill="#DFF2EA" stroke="#3F9E7C" stroke-width="1.5"/>
<rect x="859" y="566" width="260" height="12" rx="0" fill="#DFF2EA" stroke="#DFF2EA" stroke-width="0"/>
<text x="872" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1A2A3D" text-anchor="start" font-weight="bold">Type 4</text>
<text x="1105" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#3F9E7C" text-anchor="end" font-weight="bold">SQLite driver</text>
<text x="872" y="600" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="bold">Direct / thin, pure Java</text>
<text x="872" y="622" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">Speaks the database's own</text>
<text x="872" y="637" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">protocol from Java code.</text>
<text x="872" y="652" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#33465C" text-anchor="start" font-weight="normal">No extra install for the caller.</text>
