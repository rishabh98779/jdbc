<text x="57" y="730.65" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.3" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="730.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1A2A3D" text-anchor="start" font-weight="normal">TECHNICAL CLARIFICATION: sqlite-jdbc is used here as a Type 4-style, self-contained driver — application code</text>
<text x="71" y="745.3399999999999" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1A2A3D" text-anchor="start" font-weight="normal">needs no separate client library. Internally it ships and loads a native SQLite engine, so "pure Java" describes the</text>
<text x="71" y="760.64" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1A2A3D" text-anchor="start" font-weight="normal">caller's experience, not the absence of native code. There is also no server: SQLite is a file, not a service.</text></svg>