<text x="940.0" y="151.08" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.8" fill="#3F9E7C" text-anchor="middle" font-weight="normal">Registered as java.sql.Driver via META-INF/services</text>
<text x="940.0" y="164.88000000000002" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.8" fill="#3F9E7C" text-anchor="middle" font-weight="normal">Maven downloads it; the shade plugin packs it into the jar</text>
<rect x="764" y="200" width="352" height="58" rx="9" fill="#DFF2EA" stroke="#3F9E7C" stroke-width="1.5"/>
<text x="940.0" y="220.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="middle" font-weight="bold">translates standard calls</text>
