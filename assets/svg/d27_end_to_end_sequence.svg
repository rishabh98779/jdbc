<text x="71" y="879.88" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.1" fill="#1A2A3D" text-anchor="start" font-weight="normal">Every arrow is a real method call or a real stream write in the repository. The dashed vertical lines are time, not</text>
