<text x="590.0" y="784.36" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.6" fill="#33465C" text-anchor="middle" font-weight="normal">Survives:  the journal lines (operations.log) · the typed archive (sensors.bin) · the SQLite rows · a saved session (.bws).</text>
<text x="590.0" y="798.96" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.6" fill="#33465C" text-anchor="middle" font-weight="normal">Does not survive:  the EventBuffer contents · running threads · the ResourceAllocator object · the SensorFeed tick counter,</text>
<text x="590.0" y="813.5600000000001" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.6" fill="#33465C" text-anchor="middle" font-weight="normal">unless the session was saved — in which case tick, zones, stock and active missions are rebuilt from the snapshot.</text>
