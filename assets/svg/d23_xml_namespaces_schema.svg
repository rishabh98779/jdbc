<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780"><rect width="1180" height="780" fill="#FFFFFF"/><text x="40" y="44" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#0E1B2C" text-anchor="start" font-weight="bold">Diagram 26 — XML, namespaces and XML Schema</text>
<text x="40" y="64.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#647589" text-anchor="start" font-weight="normal">Markup for configuration and data, with names to avoid collisions and a schema to define the rules.</text>
<rect x="40" y="78" width="530" height="260" rx="8" fill="none" stroke="#2E82AC" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="52" y="68.65" width="239.29999999999998" height="18.7" rx="4" fill="#D9EAF3" stroke="#D9EAF3" stroke-width="0"/>
<text x="60" y="81.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#2E82AC" text-anchor="start" font-weight="bold">XML  ·  a tree of labelled elements</text>
<rect x="64" y="112" width="482" height="210" rx="8" fill="#F2F6FA" stroke="#DCE4ED" stroke-width="1.4"/>
<text x="80" y="138" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">&lt;?xml version="1.0" encoding="UTF-8"?&gt;</text>
<text x="80" y="162" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#2E82AC" text-anchor="start" font-weight="normal">&lt;basinwatch xmlns="http://example.org/basinwatch"&gt;</text>
<text x="80" y="186" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#2E82AC" text-anchor="start" font-weight="normal">  &lt;station id="G-MIL" zone="MIL"&gt;</text>
<text x="80" y="210" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">    &lt;rainfall unit="mm"&gt;17.5&lt;/rainfall&gt;</text>
<text x="80" y="234" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">    &lt;rise unit="cm"&gt;3.2&lt;/rise&gt;</text>
<text x="80" y="258" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">  &lt;/station&gt;</text>
<text x="80" y="282" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#2E82AC" text-anchor="start" font-weight="normal">&lt;/basinwatch&gt;</text>
<text x="64" y="344" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">An element has a name, attributes and content. Order and nesting carry meaning.</text>
<rect x="610" y="78" width="530" height="260" rx="8" fill="none" stroke="#6C5CA8" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="622" y="68.65" width="303.09999999999997" height="18.7" rx="4" fill="#E8E4F5" stroke="#E8E4F5" stroke-width="0"/>
<text x="630" y="81.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#6C5CA8" text-anchor="start" font-weight="bold">NAMESPACES  ·  two vocabularies, one document</text>
<rect x="634" y="112" width="482" height="210" rx="8" fill="#F2F6FA" stroke="#DCE4ED" stroke-width="1.4"/>
<text x="650" y="140" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">&lt;app:station xmlns:app="http://example.org/basinwatch"</text>
<text x="650" y="166" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">             xmlns:geo="http://example.org/geo"&gt;</text>
<text x="650" y="192" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">  &lt;app:rainfall unit="mm"&gt;17.5&lt;/app:rainfall&gt;</text>
<text x="650" y="218" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">  &lt;geo:location lat="51.5" lon="-0.12"/&gt;</text>
<text x="650" y="244" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">&lt;/app:station&gt;</text>
<text x="634" y="320" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.6" fill="#647589" text-anchor="start" font-weight="normal">app:rainfall and geo:location are different names from different vocabularies —</text>
<text x="634" y="338" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.6" fill="#647589" text-anchor="start" font-weight="normal">no collision even if both vocabularies define a rainfall element.</text>
<rect x="40" y="366" width="530" height="300" rx="8" fill="none" stroke="#3F9E7C" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="52" y="356.65" width="277.58" height="18.7" rx="4" fill="#DFF2EA" stroke="#DFF2EA" stroke-width="0"/>
<text x="60" y="369.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#3F9E7C" text-anchor="start" font-weight="bold">XML SCHEMA (XSD)  ·  rules for a document</text>
<text x="64" y="400" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">&lt;xs:element name="station"&gt;</text>
<text x="64" y="422" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">  &lt;xs:complexType&gt;</text>
<text x="64" y="444" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">    &lt;xs:sequence&gt;</text>
<text x="64" y="466" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">      &lt;xs:element name="rainfall" type="xs:decimal"/&gt;</text>
<text x="64" y="488" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">      &lt;xs:element name="rise"     type="xs:decimal"/&gt;</text>
<text x="64" y="510" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">    &lt;/xs:sequence&gt;</text>
<text x="64" y="532" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">    &lt;xs:attribute name="id" type="xs:string" use="required"/&gt;</text>
<text x="64" y="554" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">  &lt;/xs:complexType&gt;</text>
<text x="64" y="576" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">&lt;/xs:element&gt;</text>
<text x="64" y="606" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.6" fill="#647589" text-anchor="start" font-weight="normal">A schema states which elements may appear, in what order, how many times, and which</text>
<text x="64" y="624" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.6" fill="#647589" text-anchor="start" font-weight="normal">attributes are required. It turns "looks like XML" into "is valid for this vocabulary".</text>
<text x="64" y="650" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.6" fill="#647589" text-anchor="start" font-weight="normal">XSD files are themselves XML documents, so they use namespaces too.</text>
<rect x="610" y="366" width="530" height="300" rx="8" fill="none" stroke="#D9962B" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="622" y="356.65" width="245.67999999999998" height="18.7" rx="4" fill="#FBEFD6" stroke="#FBEFD6" stroke-width="0"/>
<text x="630" y="369.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#D9962B" text-anchor="start" font-weight="bold">WHERE THIS BELONGS IN A JAVA PROJECT</text>
<rect x="634" y="404" width="482" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="648" y="421" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="start" font-weight="bold">Maven pom.xml</text>
<text x="648" y="437" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.8" fill="#647589" text-anchor="start" font-weight="normal">the one XML file every Maven project really needs</text>
<rect x="634" y="448" width="482" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="648" y="465" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="start" font-weight="bold">Spring XML configuration</text>
<text x="648" y="481" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.8" fill="#647589" text-anchor="start" font-weight="normal">beans, data sources and wiring declared in markup</text>
<rect x="634" y="492" width="482" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="648" y="509" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="start" font-weight="bold">Web descriptors</text>
<text x="648" y="525" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.8" fill="#647589" text-anchor="start" font-weight="normal">web.xml, deployment descriptors, SOAP/WSDL contracts</text>
<rect x="634" y="536" width="482" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="648" y="553" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="start" font-weight="bold">Data interchange</text>
<text x="648" y="569" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.8" fill="#647589" text-anchor="start" font-weight="normal">XML payloads validated against an XSD</text>
<rect x="634" y="580" width="482" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="648" y="597" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="start" font-weight="bold">Annotations vs XML</text>
<text x="648" y="613" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.8" fill="#647589" text-anchor="start" font-weight="normal">the same intent expressed two ways — see Chapter 18</text>
<rect x="634" y="624" width="482" height="40" rx="7" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.1"/>
<text x="648" y="641" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="start" font-weight="bold">BasinWatch</text>
<text x="648" y="657" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.8" fill="#C8545C" text-anchor="start" font-weight="normal">uses pom.xml only; no Spring XML and no custom XML data</text>
<rect x="40" y="690" width="1100" height="61.599999999999994" rx="6" fill="#FBEFD6" stroke="#D9962B" stroke-width="1.3"/>
<rect x="40" y="690" width="4" height="61.599999999999994" rx="2" fill="#D9962B" stroke="#D9962B" stroke-width="0"/>
<circle cx="57" cy="704.6" r="7.5" fill="#D9962B" stroke="#D9962B" stroke-width="1.4"/>
<text x="57" y="708.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="707.96" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">IMPORTANT DISTINCTION: pom.xml is XML that Maven reads at build time. It is not read by the application at run</text>
<text x="71" y="723.1600000000001" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">time. BasinWatch reads no XML when it runs, so the XML and XSD material is examinable background and a</text>
<text x="71" y="738.36" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">RELATED TECHNIQUE — NOT USED IN BASINWATCH, except for the pom.xml itself.</text></svg>