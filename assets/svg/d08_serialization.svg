<polygon points="875,446 870.54,437.61 879.46,437.61" fill="#2E82AC"/>
<rect x="636" y="446" width="478" height="42" rx="8" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
<text x="875.0" y="461.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="middle" font-weight="bold">BasinModel.restore(snapshot)</text>
<text x="875.0" y="476.40000000000003" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#647589" text-anchor="middle" font-weight="normal">rebuild locks, allocator and threads fresh</text>
<rect x="40" y="514" width="1100" height="96" rx="9" fill="#F8E0E2" stroke="#C8545C" stroke-width="1.5"/>
<text x="590.0" y="535.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A2A3D" text-anchor="middle" font-weight="bold">WHAT IS DELIBERATELY NOT SERIALIZED</text>
<text x="590.0" y="551.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">Locks, monitors, running threads, open streams, Swing components and the ResourceAllocator itself.</text>
<text x="590.0" y="566.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">These are runtime resources, not data. They are recreated after load so the restored model is safe and consistent.</text>
<text x="590.0" y="581.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">BasinWatch also declares a transient field (sourcePathHint) to prove the point in code.</text>
<rect x="40" y="628" width="1100" height="62.5" rx="6" fill="#FBEFD6" stroke="#D9962B" stroke-width="1.3"/>
<rect x="40" y="628" width="4" height="62.5" rx="2" fill="#D9962B" stroke="#D9962B" stroke-width="0"/>
<circle cx="57" cy="642.75" r="7.5" fill="#D9962B" stroke="#D9962B" stroke-width="1.4"/>
<text x="57" y="646.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="646.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">TECHNICAL CLARIFICATION: plain Java serialization is not a safe way to read files from untrusted sources.</text>
<text x="71" y="661.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">Deserializing attacker-controlled bytes can construct arbitrary objects and run their code. BasinWatch reduces</text>
<text x="71" y="677.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">the risk with an ObjectInputFilter, an allowlist and size limits — and still treats saves as local app data only.</text>
<rect x="40" y="742" width="1100" height="56" rx="9" fill="#0E1B2C" stroke="#0E1B2C" stroke-width="1.5"/>
<text x="590.0" y="763.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#0E1B2C" text-anchor="middle" font-weight="bold">The lesson</text>
<text x="590.0" y="779.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#0E1B2C" text-anchor="middle" font-weight="normal">Serialization solves state capture. It does not, by itself, solve trust, validation or versioning — those must be added.</text></svg>