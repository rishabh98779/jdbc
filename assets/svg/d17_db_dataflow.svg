<text x="664.0" y="159.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#C8545C" text-anchor="middle" font-weight="normal">retry at most every 10 s</text>
<line x1="748" y1="165" x2="760" y2="165" stroke="#647589" stroke-width="1.6" stroke-linecap="round"/>
