<text x="57" y="234.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="233.96" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">The caller returns immediately. recordSensor() only puts a lambda on a bounded queue (capacity 2 048) —</text>
<text x="71" y="249.16" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">if that queue is full the update is rejected with a visible message instead of blocking the worker.</text>
<rect x="40" y="300" width="1100" height="36" rx="7" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.4"/>
<text x="590.0" y="322.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A2A3D" text-anchor="middle" font-weight="bold" letter-spacing="0.6">DIRECTION 2 — READ  ·  button click → table on screen</text>
<rect x="40" y="350" width="168" height="74" rx="8" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.5"/>
<text x="124.0" y="366.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="middle" font-weight="bold">DatabaseHistoryPanel</text>
<text x="124.0" y="381.40000000000003" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#2E82AC" text-anchor="middle" font-weight="normal">"Refresh history" / combo box change</text>
<line x1="208" y1="387" x2="220" y2="387" stroke="#647589" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="220,387 211.61,391.46 211.61,382.54" fill="#647589"/>
<rect x="220" y="350" width="168" height="74" rx="8" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.5"/>
