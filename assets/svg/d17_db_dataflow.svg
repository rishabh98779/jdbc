<text x="484.0" y="159.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#C8545C" text-anchor="middle" font-weight="normal">enqueue(…) on a 1-thread executor</text>
<line x1="568" y1="165" x2="580" y2="165" stroke="#647589" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="580,165 571.61,169.46 571.61,160.54" fill="#647589"/>
<rect x="580" y="128" width="168" height="74" rx="8" fill="#F8E0E2" stroke="#C8545C" stroke-width="1.5"/>
