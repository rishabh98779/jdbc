<polygon points="760,387 751.61,391.46 751.61,382.54" fill="#647589"/>
<rect x="760" y="350" width="168" height="74" rx="8" fill="#FBEFD6" stroke="#D9962B" stroke-width="1.5"/>
<text x="844.0" y="366.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="middle" font-weight="bold">ResultSet → DatabaseHistoryEntry</text>
<text x="844.0" y="381.40000000000003" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#D9962B" text-anchor="middle" font-weight="normal">rows mapped to immutable values</text>
<line x1="928" y1="387" x2="940" y2="387" stroke="#647589" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="940,387 931.61,391.46 931.61,382.54" fill="#647589"/>
<rect x="940" y="350" width="168" height="74" rx="8" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.5"/>
<text x="1024.0" y="366.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="middle" font-weight="bold">whenComplete → invokeLater</text>
<text x="1024.0" y="381.40000000000003" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#2E82AC" text-anchor="middle" font-weight="normal">tableModel.setEntries(entries)</text>
<rect x="40" y="446" width="1100" height="90" rx="9" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
<text x="590.0" y="466.76" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.2" fill="#1A2A3D" text-anchor="middle" font-weight="bold">THE STALE-RESULT GUARD</text>
<text x="590.0" y="482.56" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#33465C" text-anchor="middle" font-weight="normal">DatabaseHistoryPanel keeps an AtomicLong requestNumber. Each refresh increments it and captures the value.</text>
<text x="590.0" y="497.36" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#33465C" text-anchor="middle" font-weight="normal">When the future completes, the callback compares its captured number with the current one; if they differ, the</text>
<text x="590.0" y="512.16" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#33465C" text-anchor="middle" font-weight="normal">result is discarded. A slow earlier query can therefore never overwrite the display of a newer one.</text>
<rect x="40" y="556" width="1100" height="76" rx="9" fill="#0E1B2C" stroke="#0E1B2C" stroke-width="1.5"/>
<text x="590.0" y="577.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#0E1B2C" text-anchor="middle" font-weight="bold">BOUNDARY RULE</text>
<text x="590.0" y="593.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">Every database call happens on the basin-database thread or the basin-control thread.</text>
<text x="590.0" y="608.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">Swing is touched only inside SwingUtilities.invokeLater(...) — the single rule that keeps the interface responsive.</text>
<rect x="40" y="654" width="1100" height="46.4" rx="6" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.3"/>
<rect x="40" y="654" width="4" height="46.4" rx="2" fill="#2E82AC" stroke="#2E82AC" stroke-width="0"/>
<circle cx="57" cy="668.6" r="7.5" fill="#2E82AC" stroke="#2E82AC" stroke-width="1.4"/>
<text x="57" y="672.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="671.96" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">Notice the asymmetry: writes are fire-and-forget; reads return a future the panel can wait on without blocking.</text>
<text x="71" y="687.1600000000001" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">That is what makes the optional database safe to add to an application that must keep running without it.</text></svg>