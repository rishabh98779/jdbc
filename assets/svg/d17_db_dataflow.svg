<text x="304.0" y="381.40000000000003" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#2E82AC" text-anchor="middle" font-weight="normal">returns CompletableFuture&lt;List&lt;…&gt;&gt;</text>
<line x1="388" y1="387" x2="400" y2="387" stroke="#647589" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="400,387 391.61,391.46 391.61,382.54" fill="#647589"/>
<rect x="400" y="350" width="168" height="74" rx="8" fill="#F8E0E2" stroke="#C8545C" stroke-width="1.5"/>
<text x="484.0" y="366.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="middle" font-weight="bold">DatabaseService.loadHistory</text>
<text x="484.0" y="381.40000000000003" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#C8545C" text-anchor="middle" font-weight="normal">switch on DatabaseHistoryType</text>
<line x1="568" y1="387" x2="580" y2="387" stroke="#647589" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="580,387 571.61,391.46 571.61,382.54" fill="#647589"/>
<rect x="580" y="350" width="168" height="74" rx="8" fill="#F8E0E2" stroke="#C8545C" stroke-width="1.5"/>
<text x="664.0" y="366.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="middle" font-weight="bold">Repository.findRecent(200)</text>
<text x="664.0" y="381.40000000000003" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#C8545C" text-anchor="middle" font-weight="normal">SELECT … ORDER BY id DESC LIMIT ?</text>
