<text x="875.0" y="360.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#C8545C" text-anchor="middle" font-weight="normal">the mission row is undone too</text>
<line x1="875" y1="374" x2="875" y2="382" stroke="#C8545C" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="875,382 870.54,373.61 879.46,373.61" fill="#C8545C"/>
<rect x="634" y="382" width="482" height="46" rx="8" fill="#F8E0E2" stroke="#C8545C" stroke-width="1.5"/>
<text x="875.0" y="399.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="middle" font-weight="bold">throw ex</text>
<text x="875.0" y="414.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#C8545C" text-anchor="middle" font-weight="normal">the failure reaches DatabaseService</text>
<line x1="875" y1="428" x2="875" y2="436" stroke="#C8545C" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="875,436 870.54,427.61 879.46,427.61" fill="#C8545C"/>
<rect x="40" y="476" width="1100" height="96" rx="9" fill="#0E1B2C" stroke="#0E1B2C" stroke-width="1.5"/>
<text x="590.0" y="497.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#0E1B2C" text-anchor="middle" font-weight="bold">WHY THIS MATTERS HERE</text>
<text x="590.0" y="513.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">Without a transaction the database could contain a mission row whose resource rows were never written, or</text>
<text x="590.0" y="528.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">resource rows pointing at a mission that does not exist. Either state would make the history lie about what</text>
<text x="590.0" y="543.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">actually happened. The foreign key resource_usage.mission_id REFERENCES missions(id) also protects this.</text>
<rect x="40" y="588" width="1100" height="96" rx="9" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
<text x="590.0" y="609.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A2A3D" text-anchor="middle" font-weight="bold">THE GUARD CLAUSE IN updateStatus()</text>
<text x="590.0" y="625.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">UPDATE missions SET status = ?, completed_at = ? WHERE id = ? AND status = 'ACTIVE'</text>
<text x="590.0" y="640.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">if (changed != 1) throw new SQLException("The active mission record was not found: " + mission.id());</text>
<text x="590.0" y="655.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">Updating only an ACTIVE row makes the operation idempotent-safe: a second completion cannot silently succeed.</text>
<rect x="40" y="700" width="1100" height="46.6" rx="6" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.3"/>
<rect x="40" y="700" width="4" height="46.6" rx="2" fill="#2E82AC" stroke="#2E82AC" stroke-width="0"/>
<circle cx="57" cy="714.65" r="7.5" fill="#2E82AC" stroke="#2E82AC" stroke-width="1.4"/>
<text x="57" y="718.65" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.3" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="718.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1A2A3D" text-anchor="start" font-weight="normal">The rollback helper never hides the original failure: rollback errors are added as suppressed exceptions</text>
<text x="71" y="733.3399999999999" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1A2A3D" text-anchor="start" font-weight="normal">(original.addSuppressed(rollbackError)), so a rollback problem cannot mask the real cause.</text></svg>