<line x1="305" y1="428" x2="305" y2="436" stroke="#3F9E7C" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="305,436 300.54,427.61 309.46,427.61" fill="#3F9E7C"/>
<rect x="610" y="78" width="530" height="380" rx="8" fill="none" stroke="#C8545C" stroke-width="1.3" stroke-dasharray="5 4"/>
