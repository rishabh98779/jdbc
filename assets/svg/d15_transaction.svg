<text x="875.0" y="306.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#C8545C" text-anchor="middle" font-weight="normal">throws SQLException</text>
<line x1="875" y1="320" x2="875" y2="328" stroke="#C8545C" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="875,328 870.54,319.61 879.46,319.61" fill="#C8545C"/>
<rect x="634" y="328" width="482" height="46" rx="8" fill="#F8E0E2" stroke="#C8545C" stroke-width="1.5"/>
