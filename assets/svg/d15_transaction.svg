<text x="875.0" y="144.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#2E82AC" text-anchor="middle" font-weight="normal">a fresh SQLite connection</text>
<line x1="875" y1="158" x2="875" y2="166" stroke="#3F9E7C" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="875,166 870.54,157.61 879.46,157.61" fill="#3F9E7C"/>
<rect x="634" y="166" width="482" height="46" rx="8" fill="#E8E4F5" stroke="#6C5CA8" stroke-width="1.5"/>
<text x="875.0" y="183.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="middle" font-weight="bold">setAutoCommit(false)</text>
<text x="875.0" y="198.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#6C5CA8" text-anchor="middle" font-weight="normal">start an explicit transaction</text>
<line x1="875" y1="212" x2="875" y2="220" stroke="#3F9E7C" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="875,220 870.54,211.61 879.46,211.61" fill="#3F9E7C"/>
<rect x="634" y="220" width="482" height="46" rx="8" fill="#DFF2EA" stroke="#3F9E7C" stroke-width="1.5"/>
<text x="875.0" y="237.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="middle" font-weight="bold">INSERT INTO missions</text>
<text x="875.0" y="252.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#3F9E7C" text-anchor="middle" font-weight="normal">succeeds inside the transaction</text>
<line x1="875" y1="266" x2="875" y2="274" stroke="#3F9E7C" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="875,274 870.54,265.61 879.46,265.61" fill="#3F9E7C"/>
<rect x="634" y="274" width="482" height="46" rx="8" fill="#F8E0E2" stroke="#C8545C" stroke-width="1.5"/>
