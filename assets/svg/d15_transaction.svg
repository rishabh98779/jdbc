<text x="305.0" y="252.12" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#3F9E7C" text-anchor="middle" font-weight="normal">the mission row (id, type, zone, status…)</text>
<line x1="305" y1="266" x2="305" y2="274" stroke="#3F9E7C" stroke-width="1.5" stroke-linecap="round"/>
