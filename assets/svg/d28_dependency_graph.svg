<text x="60" y="675.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">DEPENDENCY RULES</text>
<text x="64" y="706" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="12" fill="#1A2A3D" text-anchor="start" font-weight="bold">app  →  engine  →  domain, io, db</text>
<text x="64" y="730" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">io and db never import app or engine. domain imports nothing from the other packages.</text>
<text x="64" y="754" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">Repositories are constructed by DatabaseService, which is constructed by BasinEngine — manual constructor injection.</text>
<text x="64" y="778" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">Dependencies point one way. That is why the model can be tested with no database, no files and no window.</text>
<text x="64" y="802" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#2E82AC" text-anchor="start" font-weight="bold">InvariantSuite exploits exactly this: it drives BasinModel, SnapshotStore and DatabaseService directly.</text></svg>