<text x="990.0" y="383.68000000000006" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#C8545C" text-anchor="middle" font-weight="normal">META-INF/services. Without the</text>
<text x="990.0" y="397.28000000000003" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#C8545C" text-anchor="middle" font-weight="normal">ServicesResourceTransformer the</text>
<text x="990.0" y="410.88000000000005" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#C8545C" text-anchor="middle" font-weight="normal">driver would not be found.</text>
<rect x="864" y="452" width="252" height="70" rx="9" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
