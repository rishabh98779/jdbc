<text x="990.0" y="486.08000000000004" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#647589" text-anchor="middle" font-weight="normal">~/.m2/repository caches</text>
<text x="990.0" y="499.68000000000006" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.6" fill="#647589" text-anchor="middle" font-weight="normal">sqlite-jdbc after the first build</text>
<rect x="40" y="556" width="1100" height="96" rx="9" fill="#0E1B2C" stroke="#0E1B2C" stroke-width="1.5"/>
<text x="590.0" y="577.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#0E1B2C" text-anchor="middle" font-weight="bold">HOW DEPENDENCIES REACH THE RUNNING APPLICATION</text>
<text x="590.0" y="593.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">pom.xml declares the dependency → Maven downloads the jar into ~/.m2 → the compiler puts it on the classpath →</text>
<text x="590.0" y="608.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">the shade plugin merges it into the output jar → at run time DriverManager can find the driver class →</text>
<text x="590.0" y="623.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">without the driver, jdbc:sqlite:… cannot be opened, and DatabaseService would report the database as unavailable.</text>
<rect x="40" y="668" width="1100" height="46.4" rx="6" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.3"/>
<rect x="40" y="668" width="4" height="46.4" rx="2" fill="#2E82AC" stroke="#2E82AC" stroke-width="0"/>
<circle cx="57" cy="682.6" r="7.5" fill="#2E82AC" stroke="#2E82AC" stroke-width="1.4"/>
<text x="57" y="686.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="685.96" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">The pom.xml also shows a second, optional path: the thin jar from maven-jar-plugin is useful when running from an</text>
<text x="71" y="701.1600000000001" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">IDE or with an explicit classpath. The shaded jar is what DEPLOYMENT.md ships to a machine without Maven.</text></svg>