<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660"><rect width="1180" height="660" fill="#FFFFFF"/><text x="40" y="44" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#0E1B2C" text-anchor="start" font-weight="bold">Diagram 3 — POJO versus JavaBean</text>
<text x="40" y="64.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#647589" text-anchor="start" font-weight="normal">Two ways of describing a plain Java class. One is a style; the other is a convention with rules.</text>
<rect x="40" y="78" width="530" height="380" rx="8" fill="none" stroke="#2E82AC" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="52" y="68.65" width="207.39999999999998" height="18.7" rx="4" fill="#D9EAF3" stroke="#D9EAF3" stroke-width="0"/>
<text x="60" y="81.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#2E82AC" text-anchor="start" font-weight="bold">POJO  ·  Plain Old Java Object</text>
<rect x="64" y="112" width="482" height="176" rx="8" fill="#F2F6FA" stroke="#DCE4ED" stroke-width="1.4"/>
<text x="80" y="140" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#2E82AC" text-anchor="start" font-weight="normal">public record SensorReading(</text>
<text x="80" y="162" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">        long tick,</text>
<text x="80" y="184" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">        String stationId,</text>
<text x="80" y="206" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">        String zoneId,</text>
<text x="80" y="228" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">        double rainfallMillimeters,</text>
<text x="80" y="250" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">        double observedRiseCentimeters)</text>
<text x="80" y="272" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">        implements BasinEvent { }</text>
<text x="64" y="306" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">Rules: none. Any ordinary class with fields and behaviour is a POJO.</text>
<text x="64" y="326" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">BasinWatch uses records — immutable POJOs with generated accessors.</text>
<text x="64" y="352" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">Records are ideal for values that cross a boundary and never change:</text>
<text x="64" y="370" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">SensorReading, ZoneSnapshot, MissionSnapshot, DatabaseHistoryEntry.</text>
<rect x="64" y="386" width="482" height="56" rx="9" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
<text x="305.0" y="405.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="middle" font-weight="bold">GOOD FOR</text>
<text x="305.0" y="421.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.4" fill="#647589" text-anchor="middle" font-weight="normal">immutable events, snapshots and DTOs — no boilerplate, no accidental mutation</text>
<rect x="610" y="78" width="530" height="380" rx="8" fill="none" stroke="#6C5CA8" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="622" y="68.65" width="283.96" height="18.7" rx="4" fill="#E8E4F5" stroke="#E8E4F5" stroke-width="0"/>
<text x="630" y="81.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#6C5CA8" text-anchor="start" font-weight="bold">JAVABEAN  ·  a POJO following a convention</text>
<rect x="634" y="112" width="482" height="176" rx="8" fill="#F2F6FA" stroke="#DCE4ED" stroke-width="1.4"/>
<text x="650" y="140" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#6C5CA8" text-anchor="start" font-weight="normal">public class SensorReading {</text>
<text x="650" y="162" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">    private long tick;</text>
<text x="650" y="184" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">    public long getTick() { return tick; }</text>
<text x="650" y="206" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">    public void setTick(long t) { this.tick = t; }</text>
<text x="650" y="228" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">    public SensorReading() { }   // no-arg ctor</text>
<text x="650" y="250" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">    // implements Serializable</text>
<text x="650" y="272" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10.6" fill="#1A2A3D" text-anchor="start" font-weight="normal">}</text>
<text x="634" y="306" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">Rules: public no-argument constructor · private fields ·</text>
<text x="634" y="326" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">getX/setX accessors · often implements Serializable.</text>
<text x="634" y="352" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">Frameworks (Spring, JSP/EL, ORM tools, XML decoders) rely on these</text>
<text x="634" y="370" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.8" fill="#647589" text-anchor="start" font-weight="normal">rules to create and populate objects by reflection.</text>
<rect x="634" y="386" width="482" height="56" rx="9" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
<text x="875.0" y="405.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A2A3D" text-anchor="middle" font-weight="bold">GOOD FOR</text>
<text x="875.0" y="421.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.4" fill="#647589" text-anchor="middle" font-weight="normal">framework-managed objects that must be created and filled by name</text>
<rect x="40" y="476" width="1100" height="76.8" rx="6" fill="#FBEFD6" stroke="#D9962B" stroke-width="1.3"/>
<rect x="40" y="476" width="4" height="76.8" rx="2" fill="#D9962B" stroke="#D9962B" stroke-width="0"/>
<circle cx="57" cy="490.6" r="7.5" fill="#D9962B" stroke="#D9962B" stroke-width="1.4"/>
<text x="57" y="494.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="493.96" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">IMPORTANT DISTINCTION: every JavaBean is a POJO, but not every POJO is a JavaBean. A record is a POJO and is</text>
<text x="71" y="509.15999999999997" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">definitely not a JavaBean — it has no no-argument constructor and no setX methods. BasinWatch's Saved* classes</text>
<text x="71" y="524.36" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">sit in between: private-package plain classes with a no-argument constructor for serialization, but no getters.</text>
<text x="71" y="539.56" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">They work because ObjectInputStream restores fields directly rather than through accessors.</text></svg>