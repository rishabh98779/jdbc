<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640"><rect width="1180" height="640" fill="#FFFFFF"/><text x="40" y="44" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#0E1B2C" text-anchor="start" font-weight="bold">Diagram 20 — Database failure isolation</text>
<text x="40" y="64.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#647589" text-anchor="start" font-weight="normal">The database is optional. When it fails, the simulation must not notice anything except a message.</text>
<rect x="40" y="84" width="520" height="64" rx="9" fill="#F8E0E2" stroke="#C8545C" stroke-width="1.5"/>
<text x="300.0" y="105.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1A2A3D" text-anchor="middle" font-weight="bold">WHAT FAILS</text>
<text x="300.0" y="121.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#C8545C" text-anchor="middle" font-weight="normal">SQLite file locked · directory not writable · driver missing · disk full</text>
<rect x="620" y="84" width="520" height="64" rx="9" fill="#DFF2EA" stroke="#3F9E7C" stroke-width="1.5"/>
<text x="880.0" y="105.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1A2A3D" text-anchor="middle" font-weight="bold">WHAT MUST KEEP WORKING</text>
<text x="880.0" y="121.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#3F9E7C" text-anchor="middle" font-weight="normal">observation intake · risk assessment · dispatch · file archive · journal · reports · saves</text>
<line x1="560" y1="116" x2="616" y2="116" stroke="#647589" stroke-width="1.8" stroke-linecap="round"/>
<line x1="616" y1="116" x2="560" y2="116" stroke="#647589" stroke-width="1.8" stroke-linecap="round"/>
<rect x="40" y="176" width="1100" height="220" rx="8" fill="none" stroke="#647589" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="52" y="166.65" width="188.26" height="18.7" rx="4" fill="#EDF2F7" stroke="#EDF2F7" stroke-width="0"/>
<text x="60" y="179.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">THE MECHANISM, STEP BY STEP</text>
<rect x="64" y="212" width="1052" height="24" rx="4" fill="#F2F6FA" stroke="#F2F6FA" stroke-width="0"/>
<text x="78" y="229" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">1</text>
<text x="104" y="229" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="start" font-weight="bold">SQLException thrown</text>
<text x="360" y="229" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">any repository call fails</text>
<rect x="64" y="237" width="1052" height="24" rx="4" fill="#FFFFFF" stroke="#F2F6FA" stroke-width="0"/>
<text x="78" y="254" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">2</text>
<text x="104" y="254" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="start" font-weight="bold">initialized = false</text>
<text x="360" y="254" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">the next call will try to initialise again</text>
<rect x="64" y="262" width="1052" height="24" rx="4" fill="#F2F6FA" stroke="#F2F6FA" stroke-width="0"/>
<text x="78" y="279" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">3</text>
<text x="104" y="279" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="start" font-weight="bold">databaseFailed(msg, ex)</text>
<text x="360" y="279" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">status becomes "Database unavailable · …"</text>
<rect x="64" y="287" width="1052" height="24" rx="4" fill="#FFFFFF" stroke="#F2F6FA" stroke-width="0"/>
<text x="78" y="304" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">4</text>
<text x="104" y="304" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="start" font-weight="bold">failureReporter.accept</text>
<text x="360" y="304" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">BasinEngine records a DATABASE WARNING activity entry</text>
<rect x="64" y="312" width="1052" height="24" rx="4" fill="#F2F6FA" stroke="#F2F6FA" stroke-width="0"/>
<text x="78" y="329" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">5</text>
<text x="104" y="329" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="start" font-weight="bold">journal.append</text>
<text x="360" y="329" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">the warning is also written to operations.log</text>
<rect x="64" y="337" width="1052" height="24" rx="4" fill="#FFFFFF" stroke="#F2F6FA" stroke-width="0"/>
<text x="78" y="354" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">6</text>
<text x="104" y="354" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="start" font-weight="bold">simulation continues</text>
<text x="360" y="354" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">no exception escapes into the event-processing path</text>
<rect x="64" y="362" width="1052" height="24" rx="4" fill="#F2F6FA" stroke="#F2F6FA" stroke-width="0"/>
<text x="78" y="379" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">7</text>
<text x="104" y="379" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" fill="#1A2A3D" text-anchor="start" font-weight="bold">retry after 10 s</text>
<text x="360" y="379" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">ensureInitialized() attempts recovery on a later call</text>
<rect x="40" y="412" width="1100" height="88" rx="9" fill="#0E1B2C" stroke="#0E1B2C" stroke-width="1.5"/>
<text x="590.0" y="433.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#0E1B2C" text-anchor="middle" font-weight="bold">WHY THIS IS A DESIGN CHOICE, NOT LAZINESS</text>
<text x="590.0" y="449.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">Making the database mandatory would mean that a corrupt SQLite file stops a flood simulation from running.</text>
<text x="590.0" y="464.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">By isolating it, the application keeps its primary contract — observe, assess, dispatch, and record to files —</text>
<text x="590.0" y="479.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">while the database remains an added convenience that can be switched off by simply being unavailable.</text>
<rect x="40" y="516" width="1100" height="46.6" rx="6" fill="#DFF2EA" stroke="#3F9E7C" stroke-width="1.3"/>
<rect x="40" y="516" width="4" height="46.6" rx="2" fill="#3F9E7C" stroke="#3F9E7C" stroke-width="0"/>
<circle cx="57" cy="530.65" r="7.5" fill="#3F9E7C" stroke="#3F9E7C" stroke-width="1.4"/>
<text x="57" y="534.65" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.3" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="534.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1A2A3D" text-anchor="start" font-weight="normal">VERIFIED BY TEST: InvariantSuite.continuesWhenDatabaseIsUnavailable() points the service at an unusable</text>
<text x="71" y="549.3399999999999" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1A2A3D" text-anchor="start" font-weight="normal">location and asserts that a complete engine session still runs. The behaviour is tested, not just documented.</text></svg>