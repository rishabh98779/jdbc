<text x="71" y="606.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">Notice the deliberate split: readable text for people, typed binary for machines, object serialization for</text>
<text x="71" y="621.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">state, and metadata for discovery. This is the practical answer to "which persistence mechanism should I use?"</text></svg>