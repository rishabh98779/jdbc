<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760"><rect width="1180" height="760" fill="#FFFFFF"/><text x="40" y="44" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#0E1B2C" text-anchor="start" font-weight="bold">Diagram 19 — The BasinWatch SQLite schema</text>
<text x="40" y="64.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#647589" text-anchor="start" font-weight="normal">Four tables created by DatabaseInitializer at startup. One real foreign key.</text>
<rect x="40" y="82" width="300" height="200" rx="9" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.5"/>
<text x="190.0" y="104.05" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#1A2A3D" text-anchor="middle" font-weight="bold">sensor_readings</text>
<text x="56" y="116" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">id INTEGER PK AUTOINCREMENT</text>
<text x="56" y="138" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">timestamp TEXT NOT NULL</text>
<text x="56" y="160" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">zone TEXT NOT NULL</text>
<text x="56" y="182" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">water_level REAL NOT NULL</text>
<text x="56" y="204" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">rainfall REAL NOT NULL</text>
<text x="56" y="226" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">risk_level TEXT NOT NULL</text>
<text x="56" y="248" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">INDEX idx_sensor_readings_time</text>
<rect x="40" y="320" width="300" height="180" rx="9" fill="#E8E4F5" stroke="#6C5CA8" stroke-width="1.5"/>
<text x="190.0" y="342.05" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#1A2A3D" text-anchor="middle" font-weight="bold">operational_events</text>
<text x="56" y="354" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">id INTEGER PK AUTOINCREMENT</text>
<text x="56" y="376" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">timestamp TEXT NOT NULL</text>
<text x="56" y="398" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">event_type TEXT NOT NULL</text>
<text x="56" y="420" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">zone TEXT   (nullable)</text>
<text x="56" y="442" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">message TEXT NOT NULL</text>
<text x="56" y="464" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">INDEX idx_events_time</text>
<rect x="620" y="82" width="320" height="200" rx="9" fill="#DFF2EA" stroke="#3F9E7C" stroke-width="1.5"/>
<text x="780.0" y="104.05" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#1A2A3D" text-anchor="middle" font-weight="bold">missions</text>
<text x="636" y="116" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">id TEXT PRIMARY KEY</text>
<text x="636" y="138" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">mission_type TEXT NOT NULL</text>
<text x="636" y="160" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">zone TEXT NOT NULL</text>
<text x="636" y="182" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">status TEXT NOT NULL</text>
<text x="636" y="204" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">created_at TEXT NOT NULL</text>
<text x="636" y="226" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">completed_at TEXT  (nullable)</text>
<text x="636" y="248" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">INDEX idx_missions_created</text>
<rect x="620" y="320" width="320" height="180" rx="9" fill="#FBEFD6" stroke="#D9962B" stroke-width="1.5"/>
<text x="780.0" y="342.05" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#1A2A3D" text-anchor="middle" font-weight="bold">resource_usage</text>
<text x="636" y="354" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">id INTEGER PK AUTOINCREMENT</text>
<text x="636" y="376" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">resource_type TEXT NOT NULL</text>
<text x="636" y="398" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">amount INTEGER CHECK (amount &gt; 0)</text>
<text x="636" y="420" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">mission_id TEXT NOT NULL → missions(id)</text>
<text x="636" y="442" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">timestamp TEXT NOT NULL</text>
<text x="636" y="464" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="10" fill="#1A2A3D" text-anchor="start" font-weight="normal">INDEX idx_resource_usage_time</text>
<line x1="620" y1="430" x2="400" y2="430" stroke="#D9962B" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="400,430 408.39,425.54 408.39,434.46" fill="#D9962B"/>
<rect x="473.0" y="410.5" width="74.0" height="15.0" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="510" y="420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#D9962B" text-anchor="middle" font-weight="bold">FOREIGN KEY</text>
<rect x="40" y="528" width="1100" height="132" rx="8" fill="none" stroke="#647589" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="52" y="518.65" width="162.73999999999998" height="18.7" rx="4" fill="#EDF2F7" stroke="#EDF2F7" stroke-width="0"/>
<text x="60" y="531.85" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">RELATIONSHIPS AND RULES</text>
<text x="64" y="566" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="12.5" fill="#1A2A3D" text-anchor="start" font-weight="bold">missions (1) ──→ (many) resource_usage</text>
<text x="64" y="592" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">Every allocated resource row must reference an existing mission. PRAGMA foreign_keys = ON enforces it.</text>
<text x="64" y="616" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">sensor_readings and operational_events are independent append-only histories — they reference no other table.</text>
<text x="64" y="640" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">All four tables use CREATE TABLE IF NOT EXISTS, so startup is safe to repeat.</text>
<rect x="40" y="676" width="1100" height="46.4" rx="6" fill="#FBEFD6" stroke="#D9962B" stroke-width="1.3"/>
<rect x="40" y="676" width="4" height="46.4" rx="2" fill="#D9962B" stroke="#D9962B" stroke-width="0"/>
<circle cx="57" cy="690.6" r="7.5" fill="#D9962B" stroke="#D9962B" stroke-width="1.4"/>
<text x="57" y="694.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.2" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="693.96" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">TEXT timestamps are stored as ISO-8601 strings (Instant.toString()). SQLite has no native date type; the</text>
<text x="71" y="709.1600000000001" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1A2A3D" text-anchor="start" font-weight="normal">repository uses julianday(timestamp) &lt; julianday(?) for the retention DELETE so the comparison is still a date comparison.</text></svg>