<circle cx="77" cy="434.75" r="7.5" fill="#3F9E7C" stroke="#3F9E7C" stroke-width="1.4"/>
<text x="77" y="438.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="91" y="438.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">Why a pipe at all?  It gives the feed a real blocking endpoint, so intake can wait for data instead of</text>
<text x="91" y="453.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">polling a shared list. The two threads share no mutable object — they share a stream, which is a much</text>
<text x="91" y="469.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">narrower contract. This is the textbook piped-stream idea used for a genuine purpose.</text>
<rect x="60" y="540" width="1080" height="76" rx="9" fill="#0E1B2C" stroke="#0E1B2C" stroke-width="1.5"/>
<text x="600.0" y="561.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0E1B2C" text-anchor="middle" font-weight="bold">WHAT BELONGS TO WHOM</text>
<text x="600.0" y="577.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#33465C" text-anchor="middle" font-weight="normal">The PIPE owns transport and back-pressure  ·  the THREAD owns execution and lifecycle  ·  </text>
<text x="600.0" y="593.4" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#33465C" text-anchor="middle" font-weight="normal">the BUFFER owns queuing policy  ·  the MODEL owns domain state and invariants.</text>
<rect x="60" y="640" width="1080" height="47.0" rx="6" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.3"/>
<rect x="60" y="640" width="4" height="47.0" rx="2" fill="#2E82AC" stroke="#2E82AC" stroke-width="0"/>
<circle cx="77" cy="654.75" r="7.5" fill="#2E82AC" stroke="#2E82AC" stroke-width="1.4"/>
<text x="77" y="658.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="91" y="658.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">Blocking read: readLine() returns null only when the writer closes. Shutdown therefore closes the</text>
<text x="91" y="673.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1A2A3D" text-anchor="start" font-weight="normal">writer (SensorFeed.requestStop) so intake ends its loop naturally instead of being killed.</text></svg>