<text x="624" y="292" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#647589" text-anchor="start" font-weight="normal">Many small logical writes collapse into few large physical writes.</text>
<text x="624" y="312" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#647589" text-anchor="start" font-weight="normal">Flush pushes the tail out; close() flushes and releases the handle.</text>
<text x="624" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#2E82AC" text-anchor="start" font-weight="bold">In BasinWatch, flush happens per accepted batch and on close().</text>
