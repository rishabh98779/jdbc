<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><rect width="1180" height="700" fill="#FFFFFF"/><text x="40" y="44" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#0E1B2C" text-anchor="start" font-weight="bold">Diagram 15 — Statement, PreparedStatement and CallableStatement</text>
<text x="40" y="64.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#647589" text-anchor="start" font-weight="normal">One interface family, three levels of capability.</text>
<rect x="40" y="82" width="1100" height="60" rx="10" fill="#0E1B2C" stroke="#0E1B2C" stroke-width="1.5"/>
<text x="590.0" y="104.9" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">interface java.sql.Statement</text>
<line x1="350" y1="142" x2="350" y2="176" stroke="#2E82AC" stroke-width="1.9" stroke-linecap="round"/>
<polygon points="350,176 345.54,167.61 354.46,167.61" fill="#2E82AC"/>
<line x1="590" y1="142" x2="590" y2="176" stroke="#2E82AC" stroke-width="1.9" stroke-linecap="round"/>
<polygon points="590,176 585.54,167.61 594.46,167.61" fill="#2E82AC"/>
<line x1="830" y1="142" x2="830" y2="176" stroke="#2E82AC" stroke-width="1.9" stroke-linecap="round"/>
<polygon points="830,176 825.54,167.61 834.46,167.61" fill="#2E82AC"/>
<rect x="40" y="176" width="320" height="44" rx="9" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.5"/>
<text x="200.0" y="198.05" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#1A2A3D" text-anchor="middle" font-weight="bold">Statement</text>
<rect x="40" y="228" width="320" height="190" rx="9" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.2"/>
<text x="56" y="256" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">SQL text supplied per call</text>
<text x="56" y="286" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">execute(sql) / executeQuery(sql)</text>
<text x="56" y="316" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">No parameters, no caching</text>
<text x="56" y="346" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">Use: one-off DDL, PRAGMA</text>
<text x="56" y="376" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#2E82AC" text-anchor="start" font-weight="bold">BasinWatch: DatabaseInitializer</text>
<text x="56" y="406" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="11" fill="#2E82AC" text-anchor="start" font-weight="bold">  statement.executeUpdate(sql)</text>
<rect x="400" y="176" width="320" height="44" rx="9" fill="#E8E4F5" stroke="#6C5CA8" stroke-width="1.5"/>
<text x="560.0" y="198.05" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#1A2A3D" text-anchor="middle" font-weight="bold">PreparedStatement</text>
<rect x="400" y="228" width="320" height="190" rx="9" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.2"/>
<text x="416" y="256" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">SQL pre-compiled once</text>
<text x="416" y="286" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">? placeholders + setX() binders</text>
<text x="416" y="316" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">Reusable, safer, usually faster</text>
<text x="416" y="346" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">addBatch() / executeBatch()</text>
<text x="416" y="376" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#6C5CA8" text-anchor="start" font-weight="bold">BasinWatch: every repository</text>
<text x="416" y="406" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="11" fill="#6C5CA8" text-anchor="start" font-weight="bold">  insert / findRecent / deleteBefore</text>
<rect x="760" y="176" width="320" height="44" rx="9" fill="#EDF2F7" stroke="#647589" stroke-width="1.5"/>
<text x="920.0" y="198.05" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#1A2A3D" text-anchor="middle" font-weight="bold">CallableStatement</text>
<rect x="760" y="228" width="320" height="190" rx="9" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.2"/>
<text x="776" y="256" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">Calls a stored procedure</text>
<text x="776" y="286" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">prepareCall("{call proc(?)})")</text>
<text x="776" y="316" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">registerOutParameter for results</text>
<text x="776" y="346" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="start" font-weight="normal">Depends on database support</text>
<text x="776" y="376" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">SQLite has no stored procedures</text>
<text x="776" y="406" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#647589" text-anchor="start" font-weight="bold">RELATED TECHNIQUE — not used here</text>
<rect x="40" y="444" width="1100" height="76" rx="9" fill="#D9EAF3" stroke="#2E82AC" stroke-width="1.5"/>
<text x="590.0" y="465.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A2A3D" text-anchor="middle" font-weight="bold">RESULT-SHAPED DIFFERENCE</text>
<text x="590.0" y="481.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">executeQuery() → ResultSet    (SELECT, the caller reads rows)</text>
<text x="590.0" y="496.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#33465C" text-anchor="middle" font-weight="normal">executeUpdate() → int          (INSERT / UPDATE / DELETE, the caller reads how many rows changed)</text>
<rect x="40" y="542" width="1100" height="46.6" rx="6" fill="#FBEFD6" stroke="#D9962B" stroke-width="1.3"/>
<rect x="40" y="542" width="4" height="46.6" rx="2" fill="#D9962B" stroke="#D9962B" stroke-width="0"/>
<circle cx="57" cy="556.65" r="7.5" fill="#D9962B" stroke="#D9962B" stroke-width="1.4"/>
<text x="57" y="560.65" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.3" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
<text x="71" y="560.04" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1A2A3D" text-anchor="start" font-weight="normal">In BasinWatch, Statement appears exactly where there are no parameters to bind — creating tables and</text>
<text x="71" y="575.3399999999999" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1A2A3D" text-anchor="start" font-weight="normal">setting PRAGMAs at startup. Everywhere a value comes from the application, PreparedStatement is used instead.</text></svg>